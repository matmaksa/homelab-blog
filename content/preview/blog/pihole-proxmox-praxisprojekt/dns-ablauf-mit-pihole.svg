<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DNS-Weg vor und mit Pi-hole</title>
  <desc id="desc">Die Grafik vergleicht eine direkte DNS-Anfrage mit dem Ablauf über Pi-hole. Pi-hole prüft Anfragen und leitet erlaubte Domains an einen Upstream-DNS weiter.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <style>
      .heading { font: 700 32px Arial, sans-serif; fill: #172033; }
      .panelTitle { font: 700 27px Arial, sans-serif; fill: #172033; }
      .label { font: 700 19px Arial, sans-serif; fill: #172033; }
      .small { font: 500 16px Arial, sans-serif; fill: #334155; }
      .flow { font: 700 15px Arial, sans-serif; fill: #1e3a8a; }
      .answer { font: 700 15px Arial, sans-serif; fill: #166534; }
      .note { font: 500 15px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="48" y="52" class="heading">So läuft eine DNS-Anfrage – vorher und mit Pi-hole</text>
  <text x="48" y="80" class="small">DNS übersetzt einen Namen wie www.google.de in eine Internetadresse.</text>

  <!-- Direkter DNS-Weg -->
  <rect x="40" y="110" width="1120" height="250" rx="18" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
  <text x="72" y="150" class="panelTitle">Vorher: bisheriger DNS-Weg</text>
  <text x="72" y="178" class="small">Der Rechner fragt direkt den bisher eingestellten DNS-Server.</text>

  <rect x="78" y="205" width="180" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="128" y="243" class="label">Rechner</text>
  <rect x="478" y="205" width="244" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="499" y="243" class="label">Bisheriger DNS-Server</text>
  <rect x="942" y="205" width="160" height="62" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="994" y="243" class="label">Internet</text>

  <path d="M264 220 H474" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M726 220 H938" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M938 252 H726" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M474 252 H264" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="296" y="278" width="150" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="311" y="296" class="flow">DNS-Anfrage</text>
  <rect x="520" y="278" width="190" height="26" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="535" y="296" class="answer">Antwort mit IP-Adresse</text>

  <!-- Pi-hole DNS-Weg -->
  <rect x="40" y="390" width="1120" height="310" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="72" y="430" class="panelTitle">Mit Pi-hole: Pi-hole ist dein DNS-Server</text>
  <text x="72" y="458" class="small">Pi-hole prüft die Anfrage. Erlaubte Domains werden an den Upstream-DNS weitergeleitet.</text>

  <rect x="70" y="500" width="160" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="114" y="539" class="label">Rechner</text>
  <rect x="300" y="480" width="230" height="104" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
  <text x="382" y="520" class="label">Pi-hole</text>
  <text x="336" y="550" class="small">prüft und filtert</text>
  <text x="343" y="570" class="small">DNS-Anfragen</text>
  <rect x="650" y="500" width="150" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="690" y="539" class="label">Router</text>
  <rect x="920" y="480" width="210" height="104" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="951" y="520" class="label">Upstream-DNS</text>
  <text x="975" y="550" class="small">und Internet</text>

  <path d="M236 520 H296" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M534 520 H646" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M804 520 H916" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M916 552 H808" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M642 552 H538" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M294 552 H236" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="238" y="598" width="150" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="253" y="616" class="flow">DNS-Anfrage</text>
  <rect x="420" y="632" width="590" height="42" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="442" y="650" class="answer">Antwort: IP-Adresse</text>
  <text x="442" y="668" class="answer">oder 0.0.0.0 bei einer blockierten Domain</text>
</svg>
