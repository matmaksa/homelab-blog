<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustration: eine Anwendung im Container mit getrennten Daten</title>
  <desc id="desc">Schematische Mock-Oberfläche, keine echte Softwareaufnahme: Eine Webanwendung liegt über einer Laufzeitbox, ein separates Datenvolume bleibt außerhalb der Anwendungsschicht.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#24324a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect x="48" y="42" width="1104" height="636" rx="22" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="48" y="42" width="1104" height="70" rx="22" fill="#dbe5f2"/>
  <circle cx="86" cy="77" r="10" fill="#e77b72"/><circle cx="118" cy="77" r="10" fill="#e9b949"/><circle cx="150" cy="77" r="10" fill="#68b984"/>
  <text x="190" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f2937">ILLUSTRATION · KEIN ECHTER SCREENSHOT</text>
  <text x="96" y="164" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Anwendung und Daten getrennt denken</text>
  <text x="96" y="201" font-family="Arial,sans-serif" font-size="21" fill="#475569">Das Bedienmodell als vereinfachte Mock-Oberfläche – ohne Logo und ohne Labordaten</text>
  <rect x="96" y="252" width="360" height="210" rx="18" fill="#e8f0ff" stroke="#527bbd" stroke-width="4"/>
  <rect x="122" y="286" width="308" height="58" rx="12" fill="#527bbd"/>
  <text x="150" y="323" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">ANWENDUNG</text>
  <text x="122" y="388" font-family="Arial,sans-serif" font-size="22" fill="#172033">Weboberfläche</text>
  <text x="122" y="424" font-family="Arial,sans-serif" font-size="20" fill="#475569">startet aus einer Vorlage</text>
  <path d="M480 355 H610" stroke="#527bbd" stroke-width="7" stroke-linecap="round"/><path d="m590 332 28 23-28 23" fill="none" stroke="#527bbd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="632" y="252" width="420" height="210" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="4"/>
  <text x="670" y="304" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">LAUFZEIT</text>
  <rect x="670" y="332" width="340" height="30" rx="8" fill="#cbd5e1"/><rect x="670" y="377" width="250" height="30" rx="8" fill="#cbd5e1"/>
  <text x="670" y="438" font-family="Arial,sans-serif" font-size="20" fill="#475569">Prozess · Dateien · Netzwerk</text>
  <rect x="96" y="510" width="956" height="112" rx="18" fill="#fff3d6" stroke="#c98b23" stroke-width="4"/>
  <circle cx="142" cy="566" r="25" fill="#c98b23"/><text x="134" y="575" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">!</text>
  <text x="190" y="557" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">DATENVOLUME / BIND MOUNT</text>
  <text x="190" y="591" font-family="Arial,sans-serif" font-size="21" fill="#475569">Bleibt außerhalb der kurzlebigen Anwendungsschicht und muss separat gesichert werden.</text>
</svg>
