<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768" role="img" aria-labelledby="title desc">
  <title id="title">Proxmox-Backup auf USB-HDD mit isoliertem Restore-Test</title>
  <desc id="desc">Ein Proxmox-Host schreibt ein Gast-Backup auf eine separate USB-Festplatte. Daraus wird ein Test-Container ohne Netzwerk wiederhergestellt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102a3e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65c5ee"/></marker>
  </defs>
  <rect width="1408" height="768" fill="url(#bg)"/>
  <g opacity=".12" stroke="#8ed3ef" stroke-width="1"><path d="M0 96H1408M0 192H1408M0 288H1408M0 384H1408M0 480H1408M0 576H1408M0 672H1408"/><path d="M96 0V768M192 0V768M288 0V768M384 0V768M480 0V768M576 0V768M672 0V768M768 0V768M864 0V768M960 0V768M1056 0V768M1152 0V768M1248 0V768M1344 0V768"/></g>
  <text x="80" y="92" fill="#f2f7fb" font-family="system-ui, sans-serif" font-size="40" font-weight="700">Backup-Ablauf im PVE04-Testlab</text>
  <text x="80" y="132" fill="#afc7d7" font-family="system-ui, sans-serif" font-size="21">Gast sichern → getrenntes USB-Ziel prüfen → ohne Netzwerk wiederherstellen</text>
  <g filter="url(#shadow)">
    <rect x="80" y="260" width="320" height="270" rx="26" fill="#102b3b" stroke="#65c5ee" stroke-width="3"/>
    <rect x="114" y="305" width="252" height="135" rx="12" fill="#071b29" stroke="#b7e6f7" stroke-width="2"/>
    <rect x="135" y="327" width="210" height="82" rx="6" fill="#0e4057"/>
    <path d="M195 470h90" stroke="#b7e6f7" stroke-width="7" stroke-linecap="round"/>
    <text x="240" y="570" text-anchor="middle" fill="#f2f7fb" font-family="system-ui, sans-serif" font-size="28" font-weight="700">PVE04</text>
    <text x="240" y="606" text-anchor="middle" fill="#b9d2df" font-family="system-ui, sans-serif" font-size="19">Proxmox-Gast</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="544" y="260" width="320" height="270" rx="26" fill="#17352c" stroke="#69d5a5" stroke-width="3"/>
    <rect x="598" y="326" width="212" height="117" rx="21" fill="#0c211b" stroke="#a7edd0" stroke-width="2"/>
    <circle cx="630" cy="384" r="10" fill="#69d5a5"/>
    <rect x="661" y="360" width="107" height="11" rx="5" fill="#a7edd0"/>
    <rect x="661" y="392" width="75" height="11" rx="5" fill="#5aa985"/>
    <text x="704" y="570" text-anchor="middle" fill="#f2f7fb" font-family="system-ui, sans-serif" font-size="28" font-weight="700">USB-HDD</text>
    <text x="704" y="606" text-anchor="middle" fill="#b9d2df" font-family="system-ui, sans-serif" font-size="19">Backup-Ziel</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1008" y="260" width="320" height="270" rx="26" fill="#312653" stroke="#b7a4ff" stroke-width="3"/>
    <rect x="1057" y="316" width="222" height="145" rx="14" fill="#16112d" stroke="#ded5ff" stroke-width="2"/>
    <path d="M1092 351h152M1092 385h113M1092 419h75" stroke="#cfc4ff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1241" cy="430" r="15" fill="#ffbf69"/>
    <line x1="1229" y1="418" x2="1253" y2="442" stroke="#16112d" stroke-width="4"/>
    <text x="1168" y="570" text-anchor="middle" fill="#f2f7fb" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Restore-Test</text>
    <text x="1168" y="606" text-anchor="middle" fill="#d7cefa" font-family="system-ui, sans-serif" font-size="19">neue ID, ohne Netzwerk</text>
  </g>
  <path d="M412 394H525" stroke="#65c5ee" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M876 394H989" stroke="#65c5ee" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <rect x="428" y="330" width="94" height="34" rx="17" fill="#17445b"/><text x="475" y="353" text-anchor="middle" fill="#d9f2fb" font-family="system-ui, sans-serif" font-size="16" font-weight="600">VZDump</text>
  <rect x="888" y="330" width="94" height="34" rx="17" fill="#17445b"/><text x="935" y="353" text-anchor="middle" fill="#d9f2fb" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Restore</text>
  <g font-family="system-ui, sans-serif" font-size="19" fill="#d3e4ed"><circle cx="104" cy="690" r="7" fill="#65c5ee"/><text x="122" y="697">Original bleibt unverändert</text><circle cx="496" cy="690" r="7" fill="#69d5a5"/><text x="514" y="697">Ziel ist vom Systemlaufwerk getrennt</text><circle cx="978" cy="690" r="7" fill="#b7a4ff"/><text x="996" y="697">Prüfung ohne Netzwerkkonflikt</text></g>
</svg>
