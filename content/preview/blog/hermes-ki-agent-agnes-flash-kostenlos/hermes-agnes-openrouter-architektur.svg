<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Hermes als KI-Agent mit Agnes Flash – Architektur und OpenRouter-Limits</title>
  <desc id="desc">Hermes Agent ruft über einen Custom Provider (OpenAI-kompatibel) die Agnes-API auf. Rechts: OpenRouter-Free-Limits von 20 Anfragen pro Minute und 50 bis 1000 pro Tag.</desc>
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Hermes als KI-Agent – kostenlos mit Agnes Flash</text>
  <text x="400" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">Lab-Aufbau MATMAKSA (2026-08-11) · OpenAI-kompatible API</text>

  <rect x="50" y="110" width="240" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="142" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Hermes Agent</text>
  <text x="170" y="168" text-anchor="middle" fill="#cbd5e1" font-size="13">KI-Agent (CLI, Automatisierung)</text>
  <text x="170" y="192" text-anchor="middle" fill="#94a3b8" font-size="12">✓ Tool-/Function-Calling</text>
  <text x="170" y="212" text-anchor="middle" fill="#94a3b8" font-size="12">✓ Multi-Turn-Aufgaben</text>
  <text x="170" y="232" text-anchor="middle" fill="#94a3b8" font-size="12">✓ eigener Custom Provider</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <line x1="290" y1="185" x2="360" y2="185" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="325" y="172" text-anchor="middle" fill="#38bdf8" font-size="12">Custom Provider</text>
  <text x="325" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">OpenAI-kompatibel</text>

  <rect x="370" y="110" width="380" height="150" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="560" y="142" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Agnes API</text>
  <text x="560" y="166" text-anchor="middle" fill="#cbd5e1" font-size="13">apihub.agnes-ai.com/v1</text>
  <text x="560" y="192" text-anchor="middle" fill="#94a3b8" font-size="12">agnes-2.0-flash · schnell bei kurzen Fragen</text>
  <text x="560" y="214" text-anchor="middle" fill="#94a3b8" font-size="12">agnes-2.5-flash · strukturiert, kostenlos</text>
  <text x="560" y="236" text-anchor="middle" fill="#34d399" font-size="12">kein eigenes GPU nötig</text>

  <line x1="50" y1="300" x2="750" y2="300" stroke="#334155" stroke-width="1.5"/>

  <text x="400" y="332" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Warum nicht OpenRouter Auto/Free? (Stand 2026-08-11, offizielle Doku)</text>

  <rect x="50" y="350" width="340" height="110" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <text x="220" y="376" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="700">Kostenlose Varianten (:free)</text>
  <text x="220" y="400" text-anchor="middle" fill="#cbd5e1" font-size="13">20 Anfragen pro Minute</text>
  <text x="220" y="422" text-anchor="middle" fill="#cbd5e1" font-size="13">50 Anfragen pro Tag (unter 10 $ Guthaben)</text>
  <text x="220" y="444" text-anchor="middle" fill="#cbd5e1" font-size="13">1000 Anfragen pro Tag (ab 10 $ Guthaben)</text>

  <rect x="410" y="350" width="340" height="110" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="580" y="376" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">Für Agenten kritisch</text>
  <text x="580" y="400" text-anchor="middle" fill="#94a3b8" font-size="13">Agenten rufen Tools oft parallel auf</text>
  <text x="580" y="422" text-anchor="middle" fill="#94a3b8" font-size="13">→ 20 pro Minute sind schnell erreicht (429)</text>
  <text x="580" y="444" text-anchor="middle" fill="#94a3b8" font-size="13">Anbieter-Auslastung beeinflusst Antwortzeit</text>
</svg>
